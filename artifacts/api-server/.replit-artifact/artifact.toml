kind = "api"
previewPath = "/auth/healthz"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

# Express handles auth internally on localhost:8080.
# It is NOT publicly routed — all browser traffic enters through the Next.js
# frontend (artifacts/isola) which reverse-proxies /auth/* to this server.
# Removing paths means the dev proxy also sends /auth/* through Next.js,
# making dev and Autoscale production behave identically.

[[services]]
localPort = 8080
name = "API Server"

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

# Points at the staged deploy payload (.deploy/api-server/), not dist/
# directly — real Replit Autoscale builds lost dist/index.mjs between the
# build phase completing and the runtime container starting at least once
# (build 5867f18a) despite esbuild's own log confirming it had just been
# created. build.mjs stages an explicit copy at build time and asserts it
# exists before the build is allowed to succeed.
# `inc-isola-replit-postbuild-pnpm-store-prune-2026-08-07`.
#
# The path is `../../`-prefixed because this artifact starts with a bare
# `node` invocation (no `pnpm --filter` to re-anchor cwd first), and Replit
# runs it with cwd = this artifact's own directory (confirmed from the real
# runtime log: `artifact=artifacts/api-server`). An unprefixed
# `.deploy/api-server/index.mjs` silently resolved under
# `artifacts/api-server/.deploy/...` instead of the repo-root staged payload,
# producing `MODULE_NOT_FOUND` at container start (build 2026-08-07T21:53Z) —
# a PR87 regression `decision-authorize-artifact-cwd-path-fix-if-reproduced-2026-08-07`.
[services.production.run]
args = ["node", "--enable-source-maps", "../../.deploy/api-server/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/auth/healthz"
