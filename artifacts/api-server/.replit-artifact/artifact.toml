kind = "api"
previewPath = "/auth/healthz"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

# Express handles auth internally on localhost:8080.
# It is NOT publicly routed — all browser traffic enters through the Next.js
# frontend (artifacts/isola) which reverse-proxies /auth/* to this server.
# Removing paths means the dev proxy also sends /auth/* through Next.js,
# making dev and Autoscale production behave identically.

[[services]]
localPort = 8080
name = "API Server"

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

# Points at the staged deploy payload (.deploy/api-server/), not dist/
# directly — real Replit Autoscale builds lost dist/index.mjs between the
# build phase completing and the runtime container starting at least once
# (build 5867f18a) despite esbuild's own log confirming it had just been
# created. build.mjs stages an explicit copy at build time and asserts it
# exists before the build is allowed to succeed.
# `inc-isola-replit-postbuild-pnpm-store-prune-2026-08-07`.
#
# The path is repository-root-relative and must stay that way. Replit runs
# this artifact with cwd = the REPOSITORY ROOT, not this artifact's directory,
# despite the runtime log labelling the process `artifact=artifacts/api-server`
# — that string is a label, not a working directory. PR88 misread it, added a
# `../../` prefix, and the next real publish resolved the entrypoint to
# `/home/.deploy/api-server/index.mjs`: only reachable from cwd
# `/home/runner/workspace`, which is the proof. That prefix is reverted here.
#
# Isola's run command is NOT symmetric with this one and correctly keeps its
# `../../`: it runs via `pnpm --filter`, which re-anchors cwd to the package
# directory before the script executes. This artifact invokes `node` directly,
# so nothing re-anchors it.
[services.production.run]
args = ["node", "--enable-source-maps", ".deploy/api-server/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/auth/healthz"
