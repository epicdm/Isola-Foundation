# isola-runtime — hand-deployed Swarm stack. NOT EasyPanel-managed, by design.
#
#   deploy:  sudo docker stack deploy -c /opt/isola/isola-rt-stack.yml isolart
#   service: isolart_runtime
#   reached: http://isolart_runtime:3000 on easypanel-isola (INTERNAL ONLY)
#
# WHY THIS EXISTS — IT IS NOT THEORETICAL
# --------------------------------------
# On 2026-08-14 host03 rebooted. isola-runtime exited CLEANLY, and EasyPanel
# injects restart.condition=on-failure, which does not restart a clean exit. It
# stayed down for TWO HOURS. The Gate C gateway, with restart_policy any, came
# back by itself in the same reboot.
#
# Before the cut that was an inconvenience. After the cut, isola-runtime is in
# the live customer reply path for +1 767-295-6737, and the same clean exit
# means a customer gets silence with nothing to tell anyone. That is the entire
# reason this file exists, and the incident is the evidence.
#
# NOT PUBLICLY EXPOSED. No Traefik labels, and it deliberately does not join the
# `easypanel` network. The gateway reaches it over `easypanel-isola` only.
#
# ── IMAGE PROVENANCE — READ BEFORE CALLING IT "PINNED" ──────────────────────
#   image:    isola-runtime:gatec-2
#   built:    /opt/isola-rt-build/rt-gatec-2 from the commit adding src/instructions.ts
#             (Paperclip-sourced behaviour), on m1/ownership-store-host03-2026-08-14
#   previous: isola-runtime:gatec-1
#             sha256:f0ef326d34ef1971adf50d2df448fd2d6c8f4edfd38eeb1afc64e4b22392f289
#             — roll back by setting the tag here and re-deploying the stack.
#
# NOW PINNED BY LOCAL IMAGE ID (see the image: line). That is NOT a registry
# manifest digest — there is no registry on this host — so it is provenance by
# coincidence of there being one swarm node. It gives a byte-identical redeploy
# here and nothing portable. It is NOT a rollback mechanism.
#
# ── STATE — THE PART THAT NEEDS CARE ────────────────────────────────────────
# This service is NOT stateless. `isola_isola-runtime_state` holds the
# idempotency records, the undelivered cost-event outbox, the sub-cent
# accumulator and — the one that matters most — `conversationIssues`, the map
# from a Chatwoot conversation to its Paperclip issue. At the time of writing it
# held 39 of those.
#
# Losing it does not lose money (the outbox had 0 pending) but it WOULD create a
# second Paperclip issue for every one of those 39 live conversations on their
# next message.
#
# So: this stack takes over the SAME volume, and the old service and this one
# must NEVER run against it at once. The store is a whole-file read-modify-write
# serialised only within a single process; two processes on one volume is the
# exact race the ownership store was built in Postgres to avoid.
version: "3.8"

services:
  runtime:
    # PINNED TO A LOCAL IMAGE ID — NOT a registry manifest digest. It resolves only on
    # host03; this is provenance by coincidence of there being one swarm node.
    # EXPIRY: when a second node joins, or any built service must be reproducible off
    # host03, builds move to a registry (GHCR) and this becomes a real manifest digest.
    # was: isola-runtime:gatec-2
    image: sha256:658fcd700936458016abac2009da1d0495a39f8504986a4f7a24f3a536f481f6

    networks:
      # The private side only. The gateway calls it here. There is deliberately
      # no route in from the internet.
      - easypanel-isola

    volumes:
      # The SAME named volume the EasyPanel service used. See the state note.
      - isola_isola-runtime_state:/data

    environment:
      NODE_ENV: production
      NODE_OPTIONS: --disable-proto=throw
      PORT: "3000"

      MODEL_PROVIDER: deepseek
      MODEL_BASE_URL: https://api.deepseek.com
      MODEL_NAME: deepseek-chat
      RUNTIME_MODEL_TIMEOUT_MS: "60000"

      PAPERCLIP_BASE_URL: https://isola-ai.saas00.epic.dm
      PAPERCLIP_COMPANY_ID: 3ed3869b-463c-4876-8e16-ddc058f06cd9
      PAPERCLIP_SUCCESS_STATUS: done
      PAPERCLIP_FAILURE_STATUS: blocked

      # BEHAVIOUR COMES FROM PAPERCLIP, NOT FROM THIS IMAGE.
      # The front-desk template's system prompt is the AGENTS.md of this Paperclip
      # agent, fetched per reply. Editing it in Paperclip changes what customers are
      # told, within the TTL below. A template absent from this map keeps the prompt
      # compiled into registry.ts.
      #
      # RECONCILIATION, not a new binding: "isola-internal-manager@v1" was ALREADY
      # LIVE in this service's actual running environment (verified 2026-09-13 via
      # `docker exec ... env` against isolart_runtime) but had never been checked
      # into this file. This commit records existing production state; it changes
      # nothing running. def-isolart-deploy-file-drift-would-silently-drop-a-live-
      # paperclip-binding-2026-09-13 names the risk this closes: deploying THIS
      # FILE as it stood before this commit would have silently REMOVED the live
      # internal-manager binding on next redeploy. Other drift found in the same
      # comparison (EGRESS_ALLOWLIST missing "hermes-tunnel", HERMES_API_KEY_FILE
      # and its secret entirely absent below, PAPERCLIP_AGENT_KEY_INTERNAL_FILE
      # live despite the comment two lines below saying it is deliberately unset,
      # and the public secret's source name having moved from _v1 to _v3) is
      # reported in that same defect, NOT fixed here — out of the scope the owner
      # asked for on this branch.
      PAPERCLIP_INSTRUCTIONS_MAP: '{"isola-ai-sales-front-desk-agent@v1":"fd2867d1-ee43-4032-a1cc-52eb3379a581","isola-internal-manager@v1":"a60770e9-e0e1-431a-aef5-f2158b963f61"}'
      # Also the lag between an owner edit and a customer seeing it.
      PAPERCLIP_INSTRUCTIONS_TTL_MS: "60000"
      PAPERCLIP_INSTRUCTIONS_TIMEOUT_MS: "5000"

      # Allowlist, not default-open egress. The model provider and Paperclip,
      # nothing else.
      EGRESS_ALLOWLIST: api.deepseek.com,isola-ai.saas00.epic.dm

      RUNTIME_BUDGET_ENFORCEMENT: "true"
      RUNTIME_STATE_DIR: /data/isola-runtime-state

      # Swarm secrets, resolved by entrypoint.sh. The VALUES are not here.
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
      PAPERCLIP_API_KEY_FILE: /run/secrets/paperclip_api_key

      # PAPERCLIP_AGENT_KEY_{PUBLIC,INTERNAL} are DELIBERATELY UNSET, so config.ts
      # falls back to PAPERCLIP_API_KEY for write-backs.
      #
      # An agent-actor key CANNOT be used for a mutation here. Verified 2026-08-15:
      #   agent key, no X-Paperclip-Run-Id      -> 401 "Agent run id required"
      #   agent key, run id Paperclip never issued -> 500
      # and Paperclip exposes no route to obtain a legitimate run id (POST
      # /api/agents/{id}/runs, /heartbeat, /wake and the company-level equivalents
      # are all 404 on this build). The runtime mints its own run ids for
      # gateway-driven replies, so the agent-key path is unsatisfiable by
      # construction — it is not a credential we are missing.
      #
      # This is why every reply failed 502 persistence_failed. The board-scoped key
      # mutates without a run id (comment 201, transition 200, cost-event 201).
      #
      # PRIVILEGE NOTE: this is not an escalation — the runtime already held a
      # board-scoped PAPERCLIP_API_KEY. Narrowing it is BLOCKED UPSTREAM, not merely
      # deferred, and is tracked at:
      #   https://github.com/paperclipai/paperclip/issues/11444
      # It cannot be scoped down until Paperclip either issues a run id an agent key
      # can use, or offers a write-scoped non-agent credential.
      RUNTIME_SECRET_INTERNAL_FILE: /run/secrets/runtime_secret_internal
      RUNTIME_SECRET_PUBLIC_FILE: /run/secrets/runtime_secret_public
      # Used ONLY to read instruction bundles. Kept as its own variable rather than
      # reusing PAPERCLIP_API_KEY so that when Item 6 narrows the write credential,
      # the read path does not have to be untangled from it first.
      PAPERCLIP_BOARD_TOKEN_FILE: /run/secrets/paperclip_board_token

    secrets:
      - source: isola_rt_model_api_key_v1
        target: model_api_key
      - source: isola_rt_paperclip_api_key_v1
        target: paperclip_api_key
      # NOTE: the per-agent keys (isola_rt_pc_agent_key_public_v2 /
      # _internal_v1) are intentionally NOT mounted — see the env block above.
      # They still exist as secrets; nothing here can use them until Paperclip
      # can issue a run id.
      - source: isola_rt_secret_internal_v1
        target: runtime_secret_internal
      - source: isola_rt_secret_public_v1
        target: runtime_secret_public
      - source: isola_paperclip_board_token_v1
        target: paperclip_board_token

    # Hardening. read_only is NOT set here, unlike the gateway: this service
    # writes its durable state to /data. The volume is writable; the rootfs is
    # not written to, but leaving read_only off avoids a failure mode where a
    # future state path outside the volume silently degrades to memory-only.
    #
    # NOTE: `docker stack deploy` IGNORES security_opt and says so on every
    # deploy. no-new-privileges is therefore NOT in effect. Declared intent,
    # stated limitation — do not read this block as though it were applied.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The service drains and exits on SIGTERM; give it room to finish rather
    # than being killed at Swarm's 10s default.
    stop_grace_period: 30s

    deploy:
      replicas: 1
      # GATE C, AND THE WHOLE POINT OF THIS FILE. `any` restarts a CLEAN exit.
      # `on-failure` — what EasyPanel injects and does not let you change — does
      # not, and that is what kept this service down for two hours.
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        # NOT start-first. Two runtimes on one state volume would race on a
        # whole-file read-modify-write. Stop the old task before starting the
        # new one, and accept a few seconds of unavailability: a delivery in
        # that window is durably reserved by the gateway and recovered by its
        # sweeper.
        order: stop-first
        failure_action: rollback
      rollback_config:
        order: stop-first

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  easypanel-isola:
    external: true

volumes:
  isola_isola-runtime_state:
    external: true

secrets:
  isola_rt_model_api_key_v1:
    external: true
  isola_rt_paperclip_api_key_v1:
    external: true
  isola_rt_secret_internal_v1:
    external: true
  isola_rt_secret_public_v1:
    external: true
  isola_paperclip_board_token_v1:
    external: true
