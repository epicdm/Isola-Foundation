# isola-gateway — hand-deployed Swarm stack. NOT EasyPanel-managed, by design.
#
#   deploy:  sudo docker stack deploy -c /opt/isola/isola-gw-stack.yml isolagw
#   service: isolagw_gateway
#   url:     https://isola-gw2.saas00.epic.dm
#
# WHY THIS EXISTS
# ---------------
# EasyPanel's updateAppDeploy schema is capAdd, capDrop, command, groups,
# replicas, sysctls, tiniInit, zeroDowntime. It cannot express a restart policy
# and cannot express an image pin, so an EasyPanel-managed service cannot be
# made Gate C compliant and cannot be converted into one later. The only route
# on this host is a Compose-managed stack, which is this file.
#
# It runs BESIDE the EasyPanel service `isola_isola-gateway` on a different
# hostname. Nothing is torn down to stand this up, and rollback is deleting this
# stack and changing nothing else. `*.saas00.epic.dm` is a wildcard onto this
# host, so the new name needed no DNS work.
#
# SCOPE: the gateway only. isola-runtime and isola_ai already run and serve the
# loop; they are reached over `easypanel-isola` and are deliberately NOT
# rebuilt here.
#
# ── IMAGE PROVENANCE — READ THIS BEFORE CALLING IT "PINNED" ──────────────────
#
#   image:     isola-gateway:9715b5b
#   image id:  sha256:03195ee025724761134ddbe5e0bb1a2332e0bc16ccca263c4a7ccf5004ea3d30
#   built:     /opt/isola-gw-build/9715b5b, from `git archive` of commit 9715b5b
#              on branch m1/ownership-store-host03-2026-08-14
#   contains:  b5f4d81 (ownership store) + c54338e (ownership gate on the reply
#              path) + d2e141e (Swarm-secret entrypoint) + 9715b5b (LF fix)
#
# This is an IMMUTABLE TAG, not a registry digest pin. There is no registry on
# this host, and a `@sha256:` reference requires a repoDigest, which only a
# registry can issue. Claiming a digest pin here would be false. What this gives
# instead is: a tag that names an exact commit and is never reused, plus the
# image id recorded above so the running artifact can be checked against this
# file. That is strictly better than the `:latest` the nine EasyPanel build
# trees run — those have neither a digest nor a source commit — and it is
# honestly labelled.
#
# ghcr.io/paperclipai/paperclip is the one artifact on this estate with a
# genuine upstream repoDigest. It is not in this stack, so nothing here claims
# a pin it does not have.
#
# ── SECRETS ─────────────────────────────────────────────────────────────────
# Four Swarm secrets, delivered as files under /run/secrets and mapped to the
# environment variables the service reads by the entrypoint shim (see
# entrypoint.sh — the read happens outside the app so `node:fs` stays out of
# src/). No credential is in this file, in the image, or in the repository.
version: "3.8"

services:
  gateway:
    image: isola-gateway:9715b5b

    # Traefik discovery. THIS HOST RUNS providers.docker, NOT providers.swarm
    # (TRAEFIK_PROVIDERS_DOCKER=true, Traefik 3.6.7), so Traefik reads CONTAINER
    # labels — these — and would ignore `deploy.labels`, which is what the
    # Swarm-provider documentation tells you to use. Getting this wrong produces
    # a service that deploys cleanly and is simply never routed.
    #
    # exposedbydefault is false on this host, so traefik.enable=true is required
    # rather than optional.
    labels:
      traefik.enable: "true"
      # The container sits on two networks; without this Traefik may pick the
      # wrong address and route to something unreachable.
      traefik.docker.network: "easypanel"
      traefik.http.routers.isolagw.rule: "Host(`isola-gw2.saas00.epic.dm`)"
      traefik.http.routers.isolagw.entrypoints: "https"
      traefik.http.routers.isolagw.tls: "true"
      traefik.http.routers.isolagw.tls.certresolver: "letsencrypt"
      traefik.http.services.isolagw.loadbalancer.server.port: "3000"

    networks:
      # Traefik's only network. Ingress arrives here.
      - easypanel
      # The private side: isola_isola-ledger-db and isola_isola-runtime.
      - easypanel-isola

    environment:
      NODE_ENV: production
      NODE_OPTIONS: --disable-proto=throw
      PORT: "3000"

      CHATWOOT_BASE_URL: https://isola-chat.saas00.epic.dm
      RUNTIME_BASE_URL: http://isola_isola-runtime:3000

      # Allowlist, not a default-open egress. Additive only.
      EGRESS_ALLOWLIST: isola-chat.saas00.epic.dm,isola_isola-runtime

      GATEWAY_LEDGER_LEASE_MS: "300000"
      GATEWAY_LEDGER_RECOVERY_INTERVAL_MS: "60000"
      GATEWAY_LEDGER_RECOVERY_BATCH: "20"
      # An unreachable ledger must refuse to boot, never degrade to an
      # in-memory window that forgets an acknowledged delivery.
      GATEWAY_LEDGER_REQUIRED: "true"

      # Swarm secrets, resolved by the entrypoint. The VALUES are not here.
      GATEWAY_LEDGER_URL_FILE: /run/secrets/gateway_ledger_url
      GATEWAY_ADMIN_TOKEN_FILE: /run/secrets/gateway_admin_token
      RUNTIME_SECRET_PUBLIC_FILE: /run/secrets/gateway_runtime_secret
      GATEWAY_BINDINGS_JSON_FILE: /run/secrets/gateway_bindings

    secrets:
      - source: isola_gw_ledger_url_v1
        target: gateway_ledger_url
      - source: isola_gw_admin_token_v1
        target: gateway_admin_token
      - source: isola_gw_runtime_secret_v1
        target: gateway_runtime_secret
      - source: isola_gw_bindings_v1
        target: gateway_bindings

    deploy:
      replicas: 1
      # GATE C. EasyPanel injects `on-failure` and does not let you change it,
      # and a clean exit under that policy strands the service forever — this
      # host has an existing incident on exactly that. `any` restarts on a
      # graceful shutdown too.
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first

    # `restart: any` is RECOVERY, not DETECTION. Alerting is a separate,
    # still-outstanding piece of work; this healthcheck is what a monitor would
    # read once one exists.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  easypanel:
    external: true
  easypanel-isola:
    external: true

secrets:
  isola_gw_ledger_url_v1:
    external: true
  isola_gw_admin_token_v1:
    external: true
  isola_gw_runtime_secret_v1:
    external: true
  isola_gw_bindings_v1:
    external: true
